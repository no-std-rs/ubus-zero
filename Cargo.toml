[workspace]
members = [
    ".",
    "crates/libubox-sys",
    "crates/testkit",
    "crates/ubusd",
    "crates/ubus-client",
]
resolver = "2"
exclude = ["examples/esp32c3-router-display", "examples/noalloc-smoke"]

[package]
name = "ubus-zero"
edition = "2021"
version = "0.1.0"
# The second registry is the credentialless loopback capture used by release builds.
publish = ["crates-io", "runnerless-capture"]
license = "Apache-2.0"
description = "Pure-Rust no_std client and object provider for the OpenWrt ubus protocol"
readme = "README.md"
repository = "https://github.com/no-std-rs/ubus-zero"
homepage = "https://github.com/no-std-rs/ubus-zero"
documentation = "https://docs.rs/ubus-zero"
keywords = ["openwrt", "ubus", "ipc", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/assets/ubus-zero.svg",
    "/docs/cellctl-imports.md",
    "/docs/bounded-io.md",
    "/src/**",
    "/tests/round_trip.rs",
]

[lib]
name = "ubus"
path = "src/lib.rs"

[features]
default = ["alloc"]
alloc = ["dep:spin"]
testing = ["alloc"]
json = ["alloc", "dep:serde_json"]
unix = ["alloc", "dep:rustix", "rustix/alloc", "rustix/net", "rustix/event", "rustix/time"]
# rustix 1.1.5 socket options require its time types in isolated builds.
signal = ["dep:rustix", "rustix/pipe", "rustix/net", "rustix/time"]
portable-atomic = ["alloc", "spin/portable-atomic", "dep:portable-atomic-util"]

[dependencies]
thiserror = { version = "2", default-features = false }
spin      = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
rstest = { version = "0.27", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["alloc", "fs", "net", "process"] }
serde_json = "1"
ubus-testkit = { path = "crates/testkit" }
ubusd = { path = "crates/ubusd", features = ["testing"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"

# Keep the no_std library size-oriented; optimize the host daemon's routing/index code.
[profile.release.package.ubusd]
opt-level = 3

[profile.dev]
panic = "abort"

# Host benchmark driver is optimized independently of shipped library/broker profiles.
[profile.bench-driver]
inherits = "release"
opt-level = 3

[[test]]
name = "signal_submit"
path = "tests/signal_submit.rs"
harness = false
required-features = ["signal", "testing"]
