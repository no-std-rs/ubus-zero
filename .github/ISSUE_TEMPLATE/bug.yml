name: Bug report
description: Report a reproducible ubus-zero defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use a private security advisory instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Include the smallest reproduction and relevant wire details.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, target, broker version, and transport.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or transcript
      render: text
