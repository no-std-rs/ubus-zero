name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Stable workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Release preparation tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build compatibility broker
        run: cargo build -p ubusd --features testing

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Inspect publishable packages
        run: |
          python3 scripts/prepare-release.py "ubus-zero-v$(cat version.txt)"
          python3 scripts/check-public-packages.py
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ubus-zero") | .targets[] | select(.kind == ["lib"]) | .name')" = "ubus"
          cargo package -p ubus-zero --list --allow-dirty
          python3 scripts/package-registry-uploads.py dist/registry

  pinned-openwrt:
    name: Pinned OpenWrt parity
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      UBUS_ZERO_COMPAT: require
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned reference build
        id: reference-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dep/bin
          key: openwrt-${{ runner.os }}-${{ hashFiles('tools/ubusd-builder/Dockerfile') }}

      - name: Set up Docker Buildx
        if: steps.reference-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build pinned OpenWrt fixtures
        if: steps.reference-cache.outputs.cache-hit != 'true'
        run: tools/ubusd-builder/build.sh

      - name: Restore executable bits
        run: chmod +x .dep/bin/ubusd .dep/bin/ubus .dep/bin/uci .dep/bin/rpcd

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Build compatibility broker
        run: cargo build -p ubusd --features testing

      - name: Strict workspace suite
        run: python3 tools/ubus-compat-check.py

      - name: Fault-profile parity
        run: tools/ubus-fault-check.sh

  upstream-drift:
    name: Upstream drift watch
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      UBUS_ZERO_COMPAT: require
      UBUSD_BUILD_ARGS: "--build-arg LIBUBOX_REV=master --build-arg UBUS_REV=master"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build OpenWrt master fixtures
        run: tools/ubusd-builder/build.sh

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Build compatibility broker
        run: cargo build -p ubusd --features testing

      - name: Strict matrix against OpenWrt master
        run: python3 tools/ubus-compat-check.py
