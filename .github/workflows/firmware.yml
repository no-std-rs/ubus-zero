name: Firmware and web flasher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Public C3 firmware and flasher
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and the C3 target
        working-directory: examples/esp32c3-router-display
        run: rustup show
      - name: Cache espflash
        id: espflash
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/espflash
          key: espflash-linux-4.4.0
      - name: Install pinned image builder
        if: steps.espflash.outputs.cache-hit != 'true'
        run: cargo install espflash --version 4.4.0 --locked
      - name: Build a public factory image without credentials
        run: |
          sh tools/build-dashboard-artifact.sh
          python3 -c 'import json; assert not json.load(open("dist/firmware/latest.json"))["dirty"]'
          cd dist/firmware
          sha256sum --check SHA256SUMS
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test the browser installer
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      - name: Assemble the same firmware into the Pages site
        run: python3 tools/assemble-flasher.py dist/firmware dist/flasher
      - name: Test the installer in Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload files for Runnerless
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: router-display-firmware
          path: dist/firmware/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/flasher

  pages:
    name: Publish USB flasher
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public downloads and wildcard CORS
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python3 tools/verify-dashboard-download.py "$PAGE_URL" "$GITHUB_SHA"
