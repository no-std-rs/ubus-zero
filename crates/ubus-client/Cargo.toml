[package]
name = "ubus-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = ["crates-io", "runnerless-capture"]
description = "Installable pure-Rust ubus CLI with JSON input, output and event streams"
repository = "https://github.com/no-std-rs/ubus-zero"
readme = "README.md"
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/src/**"]

[[bin]]
name = "ubus-client"
path = "src/main.rs"

[dependencies]
ubus = { package = "ubus-zero", path = "../..", version = "0.1.0", features = ["json", "unix"] }
serde_json = "1"
rustix = { version = "1.1", default-features = false, features = ["process"] }

[dev-dependencies]
ubus-testkit = { path = "../testkit" }
ubusd = { path = "../ubusd" }
